[project]
name = "python-eshop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.2.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
